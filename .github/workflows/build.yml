name: Build DexDeck

env:
  PKF_VERSION: "3.0.0"

on:
  workflow_dispatch:
  push:
    paths:
      - 'dexdeck-source.zip'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add the port files
        run: |
          test -f dexdeck-source.zip || { echo "dexdeck-source.zip is missing"; exit 1; }
          unzip -o dexdeck-source.zip -d .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish for Linux
        run: dotnet publish src/PKForge.Linux/PKForge.Linux.csproj -c Release -r linux-x64 --self-contained true -o publish

      - name: Build the AppImage
        run: bash packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: DexDeck-x86_64.AppImage

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add the port files
        run: |
          test -f dexdeck-source.zip || { echo "dexdeck-source.zip is missing"; exit 1; }
          unzip -o dexdeck-source.zip -d .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish for Windows
        run: dotnet publish src/PKForge.Linux/PKForge.Linux.csproj -c Release -r win-x64 --self-contained true -o publish-win

      - name: Make the zip
        run: |
          mkdir DexDeck
          cp -r publish-win/. DexDeck/
          mv DexDeck/PKForge.exe DexDeck/DexDeck.exe
          printf 'DexDeck for Windows\r\n\r\n1. Unzip this whole folder anywhere.\r\n2. Double-click DexDeck.exe.\r\n3. Open Settings, then Folders, and add the folder that holds your saves.\r\n\r\nClose your emulator before editing a save. Windows may warn that the app is unrecognised because it is not signed: choose More info, then Run anyway.\r\nUnofficial and AI built. Not affiliated with PKForge. Keep backups of your saves.\r\n' > DexDeck/README.txt
          zip -qr DexDeck-windows-x64.zip DexDeck

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: DexDeck-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Show what is being published
        run: ls -l downloads

      - name: Publish one release with both downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DexDeck v${{ env.PKF_VERSION }}
          prerelease: false
          files: |
            downloads/DexDeck-x86_64.AppImage
            downloads/DexDeck-windows-x64.zip
